name: Code Quality

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Build
        run: make build
      - name: Check code quality
        run: make quality
      - name: Test
        run: make test
      - name: Format code
        run: make fmt
      - name: Tidy modules
        run: make deps.tidy
      - name: Check no diff
        run: make git.nodiff

  generated:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      # buf fetches github.com/packetbroker/api at PBAPI_REF (see Makefile) itself.
      - name: Regenerate code
        run: make clean all
      - name: Check no diff
        run: git diff --exit-code
